# aichor[smoke-test/manifest.kuberay.sample.yaml]: operator               
# yaml-language-server: $schema=https://instadeep.aichor.ai/schema/latest/manifest.schema.json  

kind: AIchorManifest
apiVersion: 0.2.2 

tags:
  - "kuberay"

builder:
  image: image
  context: smoke-test # smoke-test folder
  dockerfile: ./build/ray.Dockerfile #    v need ray installed   

spec:
  operator: kuberay
  image: image
  command: "python3 -u main.py --operator=kuberay --sleep=300 --tb-write=True"


  debug:
    jupyter: false

  tensorboard:
    enabled: true

  types:
    Head:
      resources:
        cpus: 1
        ramRatio: 2

    Workers:
      - name: cpu-workers
        count: 2
        resources:
          cpus: 1
          ramRatio: 2
          shmSizeGB: 0

